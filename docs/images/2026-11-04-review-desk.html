<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>百杰校审 · 办理、评阅与发布件</title>
<style>
*{box-sizing:border-box}body{margin:0;--ink:#182b39;--mute:#526372;--rule:#d7dfe3;--blue:#1b4f8a;--pale:#e9f1f8;--paper:#fff;color:var(--ink);background:#fff;font:15px/1.6 "PingFang SC","Microsoft YaHei",sans-serif}button,input,select,textarea{font:inherit;color:inherit}button,select,summary{cursor:pointer}button{background:#fff;border:1px solid var(--rule);border-radius:5px;padding:6px 12px;transition:background .16s,transform .16s}button:hover,summary:hover{background:var(--pale)}button:active{transform:scale(.98)}:focus-visible{outline:3px solid #3577ae;outline-offset:3px}button.primary{color:#fff;background:var(--blue);border-color:var(--blue)}a{color:var(--blue)}h1,h2,h3,p{margin:0}.serif,h1,.brand,.paper h2,.release h2{font-family:"Songti SC",STSong,SimSun,serif}.preview{display:flex;gap:14px;align-items:center;justify-content:center;padding:5px 16px;background:#203e55;color:white;font-size:12px}.preview select{background:#f1f6f9;color:#18324a;border:none;border-radius:3px;padding:3px}.top{padding:0 3%;min-height:62px;display:flex;gap:18px;align-items:center;border-bottom:1px solid var(--rule)}.brand{font-size:22px;font-weight:700;white-space:nowrap;letter-spacing:.03em}.mark{width:13px;height:19px;display:inline-block;border-inline:3px double var(--blue);vertical-align:-2px;margin-right:8px}.context{border-left:1px solid var(--rule);padding-left:18px;color:var(--mute);font-size:14px}.account{margin-left:auto;position:relative}.account summary{list-style:none;color:var(--blue);padding:5px 8px}.account summary:after{content:' ▾'}.account div{position:absolute;z-index:2;right:0;width:215px;top:36px;background:white;box-shadow:0 6px 25px #203e551c;border:1px solid var(--rule);border-radius:5px;padding:14px;font-size:14px}.account small{display:block;color:var(--mute)}.account hr{border:0;border-top:1px solid var(--rule)}.frame{display:grid;grid-template-columns:192px minmax(0,1fr);min-height:calc(100vh - 94px)}.frame.focus,.frame.fold{grid-template-columns:minmax(0,1fr)}.frame.focus>.side,.frame.fold>.side{display:none}.side,.menulist{padding:32px 14px;background:#f6f8f9;border-right:1px solid var(--rule)}.side p,.menulist p{margin:0 12px 10px;color:var(--mute);font-size:13px}.side ul,.menulist ul{list-style:none;margin:0;padding:0}.side li,.menulist li{padding:8px 12px;margin:2px 0}.side .active,.menulist .active{font-weight:650;color:var(--blue);background:#e7eff5;border-radius:4px;border-left:3px solid var(--blue);padding-left:9px}main{min-width:0;padding:clamp(20px,3vw,49px);container:desk / inline-size}.view{margin:auto;max-width:1350px}.position,.sub,.foot,.quiet{font-size:13px;color:var(--mute)}.position{margin-bottom:14px}.head{margin-bottom:24px}.head p{margin-top:6px;color:var(--mute)}h1{font-size:clamp(28px,3vw,42px);line-height:1.23;letter-spacing:.01em}.tools{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.filters,.mobiletabs{display:flex;gap:4px;flex-wrap:wrap}.filters button,.mobiletabs button{border:none;background:transparent;color:var(--mute)}.filters [aria-pressed=true],.mobiletabs [aria-pressed=true]{background:var(--pale);color:var(--blue);font-weight:bold}.search{border:1px solid #bcc8d1;border-radius:4px;padding:6px 10px;width:min(100%,245px)}.ledger{border-top:2px solid #324e62;overflow-x:auto}table{width:100%;border-collapse:collapse;text-align:left;font-size:14px}th{background:#f5f7f8;color:#485b69;font-weight:600;white-space:nowrap}td,th{padding:13px 14px;border-bottom:1px solid var(--rule)}td:first-child b{font-weight:600}td small{display:block;color:var(--mute);font-size:12px}.tag{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;font-size:13px}.tag:before{content:'';width:6px;height:6px;background:#937030;border-radius:50%}.tag.ready:before{background:#36765b}.link{background:none;color:var(--blue);border:0;text-decoration:underline;text-underline-offset:3px;white-space:nowrap;min-height:36px}.foot{margin:14px 0}.empty{padding:30px 15px}.section{margin-top:20px;padding-top:13px;border-top:1px solid var(--rule)}.section h3,.formpane h3{font-size:17px;margin:4px 0 7px}.section p{margin:4px 0 10px}.meta{color:var(--mute);font-size:14px}.headrow{display:flex;gap:18px;align-items:center;justify-content:space-between}.date{font-size:13px;font-variant-numeric:tabular-nums;color:var(--mute)}.reading{display:grid;grid-template-columns:minmax(0,1.18fr) minmax(0,1fr);border-block:1px solid var(--rule)}.paper{padding:clamp(18px,3.5vw,55px);background:#f9faf9}.paper h2{font-size:clamp(23px,2.4vw,34px);line-height:1.45}.paper p,.release p{line-height:1.85;margin:12px 0}.paper .pageno{margin-top:20px;border-top:1px solid var(--rule);padding-top:10px;font-size:13px;color:var(--mute);display:flex;justify-content:space-between;align-items:center}.formpane{padding:clamp(18px,3vw,38px);border-left:1px solid var(--rule)}textarea{width:100%;min-height:98px;resize:vertical;border:1px solid #b4c1cb;padding:10px;border-radius:4px;margin:7px 0}.formpane details,.release details{border-block:1px solid var(--rule);margin:15px 0;padding:10px 0}summary{font-weight:600;color:var(--blue)}.formpane .line,.release .line{display:flex;align-items:center;justify-content:space-between;padding:5px 0;gap:8px}.line input{width:63px;padding:2px}.mobiletabs{display:none;margin-bottom:12px}.release{max-width:800px;margin:auto}.release header{border-top:3px double var(--ink);padding-top:20px}.release h2{font-size:clamp(24px,3.2vw,38px);line-height:1.4;margin:12px 0}.verdict{display:flex;align-items:baseline;gap:14px;padding:14px 0;border-block:1px solid var(--rule)}.verdict strong{font-size:25px;color:var(--blue)}.verdict span{font-size:16px}.release h3{font-size:17px;margin:22px 0 4px}dialog{padding:0;border:1px solid var(--rule);border-radius:6px;max-width:95vw;color:var(--ink)}dialog::backdrop{background:#12304552}dialog.sidepanel{margin:0 0 0 auto;height:100dvh;max-height:100dvh;width:min(495px,100%);max-width:100%;border-radius:0;padding:24px}dialog.menupanel{margin:0 auto 0 0;width:min(290px,88vw);height:100dvh;max-height:100dvh;padding:20px}.dlghead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:24px}.dlghead h2{font-size:19px}.section .warn{padding:9px 12px;background:#f8f2e7;color:#775722}.note{margin-top:14px;font-size:12px;color:#566977}.sr{position:absolute;clip-path:inset(50%);width:1px;height:1px;overflow:hidden}
@container desk (max-width:959px){.mobiletabs{display:flex}.reading{display:block}.formpane{border:0}.reading[data-face=paper] .formpane,.reading[data-face=form] .paper{display:none}}
@media(max-width:1199px){.frame{grid-template-columns:minmax(0,1fr)}.frame>.side{display:none}}
@media(max-width:700px){.preview{justify-content:space-between;gap:4px}.context{display:none}.top{padding:6px 12px;gap:9px}.brand{font-size:19px}.account summary{font-size:13px}.top button{font-size:13px}main{padding:20px 13px}.tools{align-items:start}.search{width:100%}.ledger table{min-width:640px}.headrow{display:block}.date{display:block;margin-top:4px}dialog.sidepanel{padding:18px}.verdict{flex-wrap:wrap}.preview .optional{display:none}}
@keyframes show{from{opacity:.4;transform:translateY(2px)}to{opacity:1;transform:none}}.view,dialog[open]{animation:show .16s ease-out}@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}
</style>
<div class="preview"><span>设计原型 · 虚构数据<span class="optional"> ／ 三个独立业务时点，不执行真实送审</span></span><label>查看 <select id="sample"><option value="school">学校 · 办理</option><option value="expert">专家 · 评阅</option><option value="student">学生 · 发布件</option></select></label></div>
<header class="top"><button id="menu" aria-controls="side">菜单</button><b class="brand"><i class="mark" aria-hidden="true"></i>百杰校审</b><span class="context" id="context"></span><details class="account"><summary id="who"></summary><div>个人信息<small id="identity"></small><hr>退出登录<small>入口位置示意 · 本原型无账号会话</small></div></details></header>
<div id="frame" class="frame"><aside class="side" id="side" aria-label="菜单位置示意"></aside><main id="main"></main></div>
<dialog class="sidepanel" id="detail"><div class="dlghead"><h2>论文核验详情</h2><button data-close>关闭</button></div><div id="detailBody"></div></dialog>
<dialog class="menupanel" id="nav"><div class="dlghead"><h2>工作区导航</h2><button data-close>关闭</button></div><div class="menulist" id="navBody"></div></dialog>
<script>
const $=s=>document.querySelector(s),main=$('#main'),detail=$('#detail'),nav=$('#nav'),wide=matchMedia('(min-width:1200px)');
const title='城市雨洪模拟中的参数敏感性分析';
const records=[
 ['R-026',title,'水利工程','待核验','发现 1 处需复核的文字','匿名稿第 2 页命中校方配置的提示词。请结合上下文判断；原型不作核验结论。'],
 ['R-027','基于联邦学习的跨域表征方法','计算机科学与技术','待核验','等待人工核验','已提交原稿与匿名稿，尚待学校人工核验。'],
 ['R-028','街巷尺度与夏季步行热舒适性','建筑学','待送出','已通过匿名核验','人工核验已通过。正式页面根据当前版本和允许动作提供确认送出。'],
 ['R-029','低温条件下膜生物反应器的运行特性','环境科学与工程','待核验','等待人工核验','已提交原稿与匿名稿，尚待学校人工核验。'],
 ['R-030','多源观测下的河网流量估计','水利工程','待送出','已通过匿名核验','人工核验已通过，等待学校确认送出。']];
const dims=[['选题价值',15,13],['文献与理论基础',15,12],['研究方法',20,18],['创新性',25,21],['写作与学术规范',10,8],['研究成果与工作量',15,13]];
const roles={school:['学校审核','示例审核员',['送审准备','评审进度','结果处理','异议处理'],0],expert:['专家评阅','示例专家',['我的任务'],0],student:['学生工作台','示例学生',['我的论文','结果与异议'],1]};
let scene='school',status='全部',keyword='',page=1,face='paper',draft='',savedDraft=null,scores={},folded={};const labels=['全部','待核验','待送出'];
const note='<p class="note">设计示意 · 所示内容为虚构样本</p>';
function navState(){const modal=!wide.matches||scene==='expert';$('#frame').className='frame'+(scene==='expert'?' focus':folded[scene]?' fold':'');$('#menu').setAttribute('aria-controls',modal?'nav':'side');$('#menu').setAttribute('aria-expanded',String(modal?nav.open:!folded[scene]))}
function change(v){scene=v;const [ctx,person,items,active]=roles[v];$('#sample').value=v;$('#context').textContent=ctx;$('#who').textContent=person;$('#identity').textContent=person+' · '+ctx;$('.account').open=false;const sidebar='<p>'+ctx+'</p><ul>'+items.map((x,i)=>'<li '+(i===active?'class="active" aria-current="page"':'')+'>'+x+'</li>').join('')+'</ul>';$('#side').innerHTML=$('#navBody').innerHTML=sidebar;
navState();if(v==='school')school();else if(v==='expert')review();else release()}
function school(){main.innerHTML='<div class="view"><header class="head"><p class="position">学校管理　/　送审业务</p><h1>送审准备</h1><p>核对本校论文的匿名材料，通过后确认送出。</p></header><div class="tools"><div class="filters" aria-label="处理状态"></div><label><span class="sr">搜索论文题目或编号</span><input class="search" type="search" placeholder="搜索论文题目或编号"></label></div><div class="ledger" tabindex="0" aria-label="送审清单"><table><thead><tr><th scope="col">论文题目</th><th scope="col">学科</th><th scope="col">办理状态</th><th scope="col">操作</th></tr></thead><tbody></tbody></table><div class="empty" hidden>没有匹配的论文　<button data-reset>重置筛选</button></div></div><p class="foot" role="status"></p></div>';$('.search').value=keyword;rows();$('.search').oninput=e=>{keyword=e.target.value;rows()}}
function rows(){const contains=r=>(r[0]+r[1]).toLowerCase().includes(keyword.trim().toLowerCase());const list=records.filter(contains),filtered=list.filter(r=>status==='全部'||status===r[3]);$('.filters').innerHTML=labels.map(s=>'<button data-filter="'+s+'" aria-pressed="'+(s===status)+'">'+s+' '+list.filter(r=>s==='全部'||s===r[3]).length+'</button>').join('');$('tbody').innerHTML=filtered.map(r=>'<tr><td><b>'+r[1]+'</b><small>'+r[0]+'　·　'+r[4]+'</small></td><td>'+r[2]+'</td><td><span class="tag '+(r[3]==='待送出'?'ready':'')+'">'+r[3]+'</span></td><td><button class="link" data-open="'+r[0]+'">查看材料</button></td></tr>').join('');$('.empty').hidden=filtered.length!==0;$('.foot').textContent='共 '+filtered.length+' 篇　／　当前范围：本校样例'}
function openObj(id){const r=records.find(x=>x[0]===id);$('#detailBody').innerHTML='<p class="meta">'+r[0]+'　·　第 1 版</p><h2 class="serif">'+r[1]+'</h2><div class="section"><h3>当前办理状态</h3><p>'+r[3]+'</p><h3>材料与核验依据</h3><p>原始稿与匿名稿各一份。</p><p class="warn">'+r[5]+'</p></div><div class="section"><h3>下一步</h3><p>'+(r[3]==='待核验'?'由本校审核员核对匿名材料，再决定通过或退回。':'由本校确认送出，之后由平台运营派单。')+'</p></div>'+note;detail.showModal()}
function review(){main.innerHTML='<div class="view"><header class="head"><p class="position">我的任务　/　在线评阅</p><div class="headrow"><h1>在线评阅</h1><span class="date">任务 R-026　·　仅可阅读匿名稿</span></div></header><div class="mobiletabs" aria-label="评阅面板"><button data-face="paper">匿名材料</button><button data-face="form">评阅表</button></div><div class="reading"><article class="paper"><p class="meta">匿名论文　／　材料节选</p><h2>'+title+'</h2><div id="paperText"></div><div class="pageno"><span id="pageno"></span><button data-page></button></div></article><section class="formpane"><p class="meta">本人的评阅草稿</p><h3>主要问题</h3><label><span class="sr">主要问题</span><textarea placeholder="指出具体问题，并说明对应的论文依据"></textarea></label><details><summary>六维评分</summary>'+dims.map(([l,m],i)=>'<label class="line">'+l+'<span><input type="number" min="0" max="'+m+'" data-score="'+i+'" aria-label="'+l+'"> / '+m+'</span></label>').join('')+'</details><button class="primary" data-save>暂存本页示例</button><span id="saved" class="quiet" role="status"></span>'+note+'</section></div></div>';setFace();setPaper();$('textarea').value=draft;$('textarea').oninput=e=>{draft=e.target.value;feedback()};main.querySelectorAll('[data-score]').forEach(el=>{el.value=scores[el.dataset.score]??'';el.oninput=()=>{scores[el.dataset.score]=el.value;feedback()}});feedback()}
function snap(){return JSON.stringify([draft,scores])}function feedback(){const dirty=draft.trim()||Object.values(scores).some(x=>x!=='');$('#saved').textContent=savedDraft===snap()?'　已暂存于本次预览':dirty?'　有未暂存的修改':''}
function setFace(){$('.reading').dataset.face=face;main.querySelectorAll('[data-face]').forEach(b=>{if(b.tagName==='BUTTON')b.setAttribute('aria-pressed',String(b.dataset.face===face))})}
function setPaper(){$('#paperText').innerHTML=page===1?'<p><b>摘要</b></p><p>为比较不同降雨条件下模型参数的影响，本研究选取三组降雨过程作为对照。结果表明，下垫面渗透率对峰值流量的影响随降雨历时变化。</p><p>下文说明观测样本的划分方法，并与基准模型进行比较。</p>':'<p><b>第二节　研究方法</b></p><p>研究将历史降雨过程按历时分层，然后在各层内比较参数扰动后的径流估计。训练与验证样本不重叠。</p><p>比较指标为峰值偏差和峰现时间差，各指标分别报告。</p>';$('#pageno').textContent='节选 '+page+' / 2';$('[data-page]').textContent=page===1?'下一页':'上一页'}
function release(){main.innerHTML='<article class="release view"><p class="position">我的论文　/　结果与异议</p><header><div class="headrow"><b>匿名评阅书</b><span class="date">发布版本 1　／　2026 年 11 月 4 日</span></div><h2>'+title+'</h2><div class="verdict"><strong>通过</strong><span>85 / 100</span><small class="meta">已发布 · 专家 E-001（化名）</small></div></header><h3>主要问题</h3><p>验证集中的短历时降雨样本较少。现有结果暂不足以说明模型在这类场景中具有同样的稳定性。</p><h3>修改建议</h3><p>建议在研究方法中列出各组样本数量；补充短历时条件的误差，并在结论中区分适用范围。</p><details><summary>查看六维评分</summary>'+dims.map(([l,m,x])=>'<div class="line"><span>'+l+'</span><b>'+x+' / '+m+'</b></div>').join('')+'</details>'+note+'</article>'}
main.onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.filter){status=b.dataset.filter;rows();main.querySelector('[data-filter="'+status+'"]').focus()}else if(b.hasAttribute('data-reset')){status='全部';keyword='';school();$('.search').focus()}else if(b.dataset.open)openObj(b.dataset.open);else if(b.dataset.face){face=b.dataset.face;setFace()}else if(b.hasAttribute('data-page')){page=3-page;setPaper()}else if(b.hasAttribute('data-save')){if(!main.querySelectorAll('[data-score]:invalid').length){savedDraft=snap();feedback()}else main.querySelector('[data-score]:invalid').reportValidity()}};
$('#sample').onchange=e=>change(e.target.value);$('#menu').onclick=()=>{if(scene==='expert'||!wide.matches)nav.showModal();else folded[scene]=!folded[scene];navState()};document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>b.closest('dialog').close());nav.onclose=navState;wide.addEventListener('change',()=>{if(nav.open)nav.close();navState()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('.account').open){$('.account').open=false;$('.account summary').focus()}});change('school');
</script></html>
