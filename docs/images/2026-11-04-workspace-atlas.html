<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>六角色工作台 · 百杰校审设计图册</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f5f8;color:#21303f;font:15px/1.55 "PingFang SC","Microsoft YaHei",sans-serif}button,select{font:inherit;color:inherit}button,summary,select{cursor:pointer}button:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #5484b6;outline-offset:3px}button{border:1px solid #c4ced6;border-radius:5px;background:#fff;padding:6px 13px}button:hover{background:#eff4f8}button:active{transform:scale(.98)}button,summary{transition:background .14s,transform .14s}button.primary{background:#1b4f8a;border-color:#1b4f8a;color:white}button.primary:hover{background:#123d6b}a{color:#1b4f8a}.atlas{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:9px clamp(16px,3vw,44px);background:#233d52;color:white;font-size:13px}.atlas strong{font-weight:650;letter-spacing:.1em}.atlas label{white-space:nowrap}.atlas select{border:none;border-radius:3px;padding:4px 8px;background:#eef3f7;color:#1c3548}.top{min-height:60px;background:white;border-bottom:1px solid #d7dfe6;display:flex;align-items:center;padding:10px 24px;gap:16px}.brand,h1,.paper h2{font-family:"Songti SC",STSong,SimSun,serif}.brand{font-weight:700;letter-spacing:.03em;font-size:21px}.context{font-size:13px;color:#526172;border-left:1px solid #cbd4dc;padding-left:16px}.menu{font-size:13px}.account{position:relative;margin-left:auto}.account summary{font-size:14px;list-style:none;color:#213b51}.account summary:after{content:' ▾'}.account aside{position:absolute;right:0;top:34px;width:208px;background:white;border:1px solid #d4dde5;box-shadow:0 8px 18px #21354312;padding:14px;z-index:3;border-radius:6px}.account aside b,.account aside span{display:block}.account aside small{font-size:12px;color:#5a6b79}
.shell{display:grid;grid-template-columns:var(--nav,216px) minmax(0,1fr);min-height:calc(100vh - 120px)}.shell.personal{--nav:184px}.shell.closed{grid-template-columns:minmax(0,1fr)}.shell.closed>.rail{display:none}.rail{background:#fafbfc;border-right:1px solid #d7dfe6;padding:24px 12px}.rail ul,dialog ul{padding:0;margin:0 0 20px;list-style:none}.rail li,dialog li{padding:8px 12px;margin:2px 0;border-radius:4px}.rail li[aria-current],dialog li[aria-current]{background:#e8f0f9;color:#164b83;border-left:3px solid #1b4f8a;padding-left:9px;font-weight:650}.group,.hint{color:#536575;font-size:13px}.group{margin:0 12px 8px;font-size:12px}
main{min-width:0;padding:clamp(18px,3.2vw,50px);container:stage / inline-size}#page{max-width:1420px;margin:0 auto;animation:appear .18s ease-out}@keyframes appear{from{opacity:.45;transform:translateY(2px)}to{opacity:1;transform:none}}h1{margin:8px 0 2px;line-height:1.3;font-size:clamp(26px,3vw,35px)}h2,h3,p{margin:0}.lead{color:#52616e;margin:7px 0 22px}.path,.kicker{font-size:13px;color:#526575}.kicker{color:#1b4f8a}.card,.sheet,.paper,.form{border:1px solid #d5dfe7;border-radius:6px;background:white}.strip,.actionbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.strip{padding:15px 18px;border-bottom:1px solid #dce3e9}.pill{display:inline-block;background:#e8f0f9;color:#164b83;padding:3px 9px;border-radius:4px;font-size:13px}.strip small{color:#536575}.tablebox{overflow-x:auto}table{width:100%;border-collapse:collapse;white-space:nowrap;text-align:left;font-size:14px}th,td{padding:12px 18px;border-bottom:1px solid #e2e7eb}th{background:#f6f8fa;color:#4d6071;font-size:13px}tr:last-child td{border-bottom:0}.rowbtn{border:0;background:#edf3f8;color:#1b4f8a;padding:4px 10px}.sheet{max-width:850px;padding:clamp(20px,3vw,38px)}.sheet h2,.paper h2{font:600 22px/1.5 "Songti SC",STSong,SimSun,serif;margin:8px 0 14px}.sheet p,.paper p,.form p{margin:12px 0}.sheet .meta{border-block:1px solid #e1e7eb;padding:9px 0;font-size:14px}.paper,.form{padding:clamp(20px,2.5vw,36px);min-width:0}.paper{background:#fbfcfe;line-height:1.85}.paper .pageNo{border-top:1px solid #dce2e8;margin-top:30px;padding-top:8px;text-align:center;color:#607181}.split{display:grid;grid-template-columns:minmax(0,58fr) minmax(0,42fr);gap:16px}.form h3{margin:9px 0 6px;font-size:17px}.form dl{display:grid;grid-template-columns:1fr auto;gap:7px;margin:10px 0}.form dd{margin:0;font-variant-numeric:tabular-nums}.tabs{display:none;gap:6px;margin-bottom:12px}.tabs button[aria-pressed=true]{background:#e8f0f9;border-color:#5380ae;color:#15477c}
@container stage (max-width:959px){.tabs{display:flex}.split{display:block}.split[data-panel=material] .form,.split[data-panel=form] .paper{display:none}}
.back{font-size:13px;border:none;background:transparent;color:#1b4f8a;padding:4px 0}.note{margin:22px 0 0;font-size:13px;color:#455c70;border-left:3px solid #a5bacb;padding-left:12px}.designlabel{font-size:12px;color:#586b7b}dialog{border:0;border-right:1px solid #cfdae3;position:fixed;inset:0 auto 0 0;margin:0;padding:22px;width:min(292px,86vw);max-height:100dvh;height:100dvh}dialog::backdrop{background:#14273860}dialog header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
@media(max-width:1199px){.shell,.shell.personal{grid-template-columns:minmax(0,1fr)}.shell>.rail{display:none}}
@media(max-width:600px){.atlas{flex-wrap:wrap;gap:4px}.atlas strong{font-size:12px}.atlas .intro{display:none}.top{gap:9px;padding:10px 12px}.brand{font-size:17px}.context{display:none}main{padding:18px 12px}.strip{padding:12px}.account summary{font-size:13px}.account aside{top:28px}.lead{margin-bottom:16px}th,td{padding:10px 12px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
<div class="atlas"><div><strong>工作台设计图册</strong> <span class="intro">／ 虚构数据 · 离线排版示意，不可办理业务</span></div><label>比较视图 <select id="pick" aria-label="选择设计视图"></select></label></div>
<header class="top"><button id="navToggle" class="menu" type="button" aria-controls="rail">菜单</button><div class="brand">百杰校审</div><span class="context" id="ctx"></span><details class="account"><summary><span id="who"></span></summary><aside><b>个人信息</b><span id="identity"></span><hr><span>退出登录</span><small>位置示意；图册不含登录会话</small></aside></details></header>
<div id="shell" class="shell"><aside id="rail" class="rail" aria-label="角色主导航位置示意"></aside><main><div id="page"></div></main></div>
<dialog id="drawer"><header><strong>工作区导航</strong><button id="close" type="button">关闭</button></header><div id="drawerItems"></div></dialog>
<script>
const $=s=>document.querySelector(s);
const data={
student:{role:'学生',work:'学生工作台',who:'示例学生',items:[['','我的论文','结果与异议']],home:'我的论文',hint:'选中论文再编辑材料。论文标题不进入跨账号的全局导航。'},
mentor:{role:'导师',work:'导师工作台',who:'示例导师',items:[['','学生评审结果']],home:'学生评审结果',hint:'一项真实职责就保留一个入口。论文选择属于当前页，不把学生名单常驻左栏。'},
expert:{role:'专家',work:'专家工作台',who:'示例专家',items:[['','我的任务']],home:'我的任务',hint:'状态属于任务列表。试点“继续评阅”，比较侧栏展开和专注态。'},
school:{role:'学校审核',work:'学校管理',who:'示例审核员',items:[['送审业务','送审准备','评审进度','结果处理','异议处理'],['本校设置','批次与规则','成员与资格','学科与专业','材料检测词表']],home:'送审准备',hint:'高频办件和本校设置分开；学校可核验本校稿件，不能看到专家身份。'},
ops:{role:'平台运营',work:'运营工作台',who:'示例运营',items:[['','派单工作台','专家库','更正审批']],home:'派单工作台',hint:'先选论文，再看候选、回避与负荷。队列不直接展示打分或校方发布结果。'},
admin:{role:'系统管理',work:'系统管理',who:'示例管理员',items:[['','学校管理','官方基础目录']],home:'学校管理',hint:'学校管理的是已入驻租户；官方名录是基础数据，更新名录不等同于开通学校。'}
};
const views=[['student','学生 · 我的论文'],['edit','学生 · 稿件专注态'],['mentor','导师 · 发布结果'],['expert','专家 · 我的任务'],['review','专家 · 专注评阅'],['school','学校 · 送审准备'],['ops','平台 · 派单队列'],['admin','系统 · 学校管理']];
const pick=$('#pick'),shell=$('#shell'),page=$('#page'),drawer=$('#drawer'),toggle=$('#navToggle'),wide=matchMedia('(min-width:1200px)');let id='student';const collapsed={};
for(const [value,name] of views)pick.add(new Option(name,value));
function role(){return id==='review'?'expert':id==='edit'?'student':id}
function focusView(){return id==='review'||id==='edit'}
function nav(d){return d.items.map(([g,...items])=>(g?'<p class="group">'+g+'</p>':'')+'<ul>'+items.map(i=>'<li'+(d.home===i?' aria-current="page"':'')+'>'+i+'</li>').join('')+'</ul>').join('')}
const jump=(to,label)=>'<button type="button" class="rowbtn" data-go="'+to+'">'+label+'</button>';
function table(strip,cols,rows){return '<div class="card"><div class="strip">'+strip+'</div><div class="tablebox" tabindex="0" aria-label="示例表格"><table><thead><tr>'+cols.map(x=>'<th scope="col">'+x+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')+'</tbody></table></div></div>'}
const pill=t=>'<span class="pill">'+t+'</span>';
const content={
student:()=>table('<b>本人的论文</b><small>按论文选择下一步</small>',['论文题目','学科','状态','下一步'],[['跨校论文评阅的一致性研究','0812 计算机科学与技术',pill('草稿'),jump('edit','编辑稿件')]]),
edit:()=>'<div class="sheet"><span class="kicker">草稿 · 第 1 版</span><h2>跨校论文评阅的一致性研究</h2><p class="meta">登记信息　／　论文材料　／　提交前清单</p><h3>论文材料</h3><p>原始稿　已选取</p><p>匿名稿　待补充</p><p class="hint">原稿与匿名稿有独立的用途和校验。正式页面在提交处说明还缺什么。</p></div>',
mentor:()=>'<div class="sheet"><span class="kicker">所指导学生 · 示例学生</span><h2>跨校论文评阅的一致性研究</h2><p class="meta">已发布 · 第 1 版　／　评阅专家 E-001（化名）</p><h3>评审结论</h3><p>通过　／　85 分</p><h3>主要意见</h3><p>研究对象界定清楚。建议补充不同样本规模下的对照结果，并说明适用范围。</p></div>',
expert:()=>table('待接受　'+pill('评阅中 1')+'　已完成　已拒绝　已撤销　需要更正',['匿名任务','匿名题目','评阅截止（北京时间）','下一步'],[['R-026','跨校论文评阅的一致性研究','11 月 12 日 17:00',jump('review','继续评阅')]]),
review:()=>'<div class="tabs" aria-label="评阅面板"><button data-panel="material" aria-pressed="true">匿名材料</button><button data-panel="form" aria-pressed="false">评阅表</button></div><div class="split" data-panel="material"><article class="paper"><span class="kicker">匿名材料 · R-026</span><h2>跨校论文评阅的一致性研究</h2><p>摘要</p><p>本文比较匿名评阅样本在不同条件下的一致性，并记录指标的适用条件与误差来源。</p><p>本页仅示意阅读比例，未加载论文文件。</p><div class="pageNo">1 / 8</div></article><section class="form"><span class="kicker">评阅表 · 草稿</span><h3>分项评分</h3><dl><dt>选题价值</dt><dd>— / 15</dd><dt>文献与理论基础</dt><dd>— / 15</dd><dt>研究方法</dt><dd>— / 20</dd></dl><p class="hint">此处仅展示部分维度</p><h3>主要问题</h3><p>对照左侧匿名材料填写意见。</p></section></div>',
school:()=>table('<b>当前批次</b><small>材料待核验</small>',['论文题目','学科','当前阶段','下一步'],[['跨校论文评阅的一致性研究','计算机科学与技术',pill('待核验'),'核验材料']]),
ops:()=>table('<b>派单队列</b><small>选定论文后，再比较候选专家</small>',['论文','送审方向','状态','下一步'],[['跨校论文评阅的一致性研究','计算机科学与技术',pill('待派单'),'查看候选']]),
admin:()=>table('<b>已入驻学校</b><small>按名称、代码或状态查找</small>',['学校名称','学校代码','状态','启用管理员数','操作'],[['海川示范大学','DEMO-HC',pill('正常'),'3','管理'],['澄江示范大学','DEMO-CJ','已暂停','2','管理']])
};
function sync(){const overlay=!wide.matches||focusView(),closed=overlay||!!collapsed[role()];shell.classList.toggle('closed',closed);toggle.setAttribute('aria-expanded',String(drawer.open||!closed));toggle.setAttribute('aria-controls',overlay?'drawer':'rail');toggle.setAttribute('aria-label',drawer.open||!closed?'收起工作区菜单':'展开工作区菜单')}
function show(v){id=v;pick.value=v;const d=data[role()],f=focusView();shell.classList.toggle('personal',['student','mentor','expert'].includes(role()));$('#ctx').textContent=d.work;$('#who').textContent=d.who;$('#identity').textContent=d.who+' · '+d.role;$('.account').open=false;$('#rail').innerHTML=$('#drawerItems').innerHTML=nav(d);if(drawer.open)drawer.close();sync();
const name=id==='review'?'在线评阅':id==='edit'?'论文编辑':d.home;page.innerHTML=(f?'<button class="back" data-go="'+role()+'">返回'+d.home+'</button>':'<span class="path">'+d.work+'</span>')+'<h1 tabindex="-1">'+name+'</h1><p class="lead">'+(id==='review'?'任务 R-026 · 仅可阅读本任务的匿名材料':id==='edit'?'登记信息、准备材料、核对后提交':{student:'在这里继续草稿、处理退回或查看送审状态',mentor:'查看自己指导的学生已经发布的评审意见',expert:'查看本人邀请与已接受的匿名任务',school:'核对本校稿件，确认可以送审的材料',ops:'从待处理论文进入候选专家与派单操作',admin:'维护已开通的学校及其管理员账号'}[role()])+'</p>'+content[id]()+'<p class="note"><b>设计说明</b>　'+(f?'专注页收起侧栏；返回列表时恢复进入前的选择。':d.hint)+'</p><p class="designlabel">离线示例 · 各视图示意不同业务时点；菜单名和字段表示位置，不读取、保存或提交数据。</p>'}
toggle.onclick=()=>{if(!wide.matches||focusView()){drawer.showModal();$('#close').focus()}else collapsed[role()]=!collapsed[role()];sync()};$('#close').onclick=()=>drawer.close();drawer.onclose=()=>{sync();toggle.focus()};wide.addEventListener('change',()=>{if(drawer.open)drawer.close();sync()});pick.onchange=()=>show(pick.value);page.onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.go){show(b.dataset.go);page.querySelector('h1').focus()}else if(b.dataset.panel){$('.split').dataset.panel=b.dataset.panel;document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))}};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('.account').open){$('.account').open=false;$('.account summary').focus()}});show(id);
</script></html>
