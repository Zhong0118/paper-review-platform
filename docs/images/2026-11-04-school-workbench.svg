<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="592" viewBox="0 0 1360 592" role="img" aria-labelledby="title desc">
  <title id="title">百杰校审 · 学校管理桌面设计示意</title>
  <desc id="desc">示意数据。顶栏右侧是本人账号；左栏区分入驻学校与官方目录；中间是可筛选的学校表，学校详情从行内进入。不是已经实现的页面。</desc>
  <style>
    text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#1d2c3a;font-size:15px}
    .brand,.title{font-family:"Songti SC","STSong","SimSun",serif;font-weight:700}
    .brand{font-size:23px}.title{font-size:32px}.small{font-size:13px;fill:#536576}
    .blue{fill:#1b4f8a;font-weight:600}.th{fill:#43576a;font-size:14px;font-weight:600}
    .num{font-family:"SFMono-Regular",Consolas,monospace;font-size:14px;fill:#415466}
    .line{stroke:#dae1e7;stroke-width:1}.white{fill:white}
  </style>
